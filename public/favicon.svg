  <g fill="none" stroke="#dbe8f0" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <g id="arm">
      <line x1="32" y1="32" x2="32" y2="8"/>
      <line x1="32" y1="13.5" x2="26" y2="8"/>
      <line x1="32" y1="13.5" x2="38" y2="8"/>
      <line x1="32" y1="21" x2="27.5" y2="16.5"/>
